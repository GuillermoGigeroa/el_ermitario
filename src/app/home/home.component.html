<div class="home-container">
    <header class="catalog-intro">
        <span class="catalog-eyebrow">El universo del Ermitario</span>
        <h1>Catálogo de stickers</h1>
        <p>Conoce al Ermitario y descubre sus logos e ilustraciones.</p>
    </header>
    <div class="main" aria-label="Stickers e imágenes de El Ermitario">
        @for (item of items; track item.image) {
            <div
                class="card"
                [class.logo-card]="item.variant === 'logo'"
                [class.logo-white]="item.id === 'brand-logo-white'"
                [class.logo-black]="item.id === 'brand-logo-black'"
                [class.character-card]="item.variant === 'character'"
                [id]="item.id">
                <button
                    type="button"
                    class="preview-trigger"
                    (click)="openPreview(item)"
                    [attr.aria-label]="'Ver ' + item.text + ' en pantalla completa'">
                    <img [src]="item.image" [alt]="item.text" class="card-img-top">
                </button>
                <button class="btn-favorite" (click)="toggleFavorite(item)" [class.active]="isFavorite(item)" title="Favorito">
                    <i class="bi" [class.bi-heart]="!isFavorite(item)" [class.bi-heart-fill]="isFavorite(item)"></i>
                </button>
                <div class="card-body">
                    <p class="card-text">{{item.text}}</p>
                </div>
            </div>
        } @empty {
            <div class="card">
                <p class="card-text">No hay items para mostrar.</p>
            </div>
        }
    </div>

    @if (previewItem; as preview) {
        <div class="preview-overlay" (click)="closePreview()">
            <div
                class="preview-dialog"
                role="dialog"
                aria-modal="true"
                [attr.aria-label]="preview.text"
                (click)="$event.stopPropagation()">
                <button
                    type="button"
                    class="preview-close"
                    aria-label="Cerrar vista previa"
                    (click)="closePreview()">
                    <span aria-hidden="true">&times;</span>
                </button>
                <img [src]="preview.image" [alt]="preview.text" class="preview-image">
            </div>
        </div>
    }
</div>
