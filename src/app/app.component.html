<div class="header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <div class="isologotipo">
                <img src="assets/images/logo-color.png" alt="logo" class="logo">
                <a class="navbar-brand iso" href="#">El Ermitario</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['']" routerLinkActive="active">{{menu.INICIO}}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['/camera-frame']" routerLinkActive="active">{{menu.CAMARA}}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['/favoritos']" routerLinkActive="active">{{menu.FAVORITOS}}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['/game']" routerLinkActive="active">{{menu.JUEGO}}</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
                    <button class="btn btn-outline-dark" type="submit">Buscar</button>
                </form>
                <div class="cart-icon-container ms-3">
                    <button class="btn-cart" (click)="cart.toggleCart()">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" *ngIf="(itemCount$ | async) as count; else noBadge">
                            {{ count }}
                        </span>
                        <ng-template #noBadge></ng-template>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</div>
<div class="header-bottom"></div>
<router-outlet></router-outlet>
<app-cart #cart></app-cart>
<app-confetti [trigger]="showConfetti"></app-confetti>
