<div class="header" [class.game-route]="isGameRoute">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <div class="isologotipo">
                <img src="assets/images/logo-color.png" alt="logo" class="logo">
                <a class="navbar-brand iso" href="#">El Ermitario</a>
            </div>
            <button class="navbar-toggler" [class.game-route]="isGameRoute" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="onNavigation()">{{menu.INICIO}}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['/camera-frame']" routerLinkActive="active" (click)="onNavigation()">{{menu.CAMARA}}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['/favoritos']" routerLinkActive="active" (click)="onNavigation()">{{menu.FAVORITOS}}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="['/game']" routerLinkActive="active" (click)="onNavigation()">{{menu.JUEGO}}</a>
                    </li>
                </ul>
                <form class="d-flex search-container" role="search" (ngSubmit)="submitSearch()">
                    <input
                        class="form-control me-2"
                        type="search"
                        name="search"
                        placeholder="Buscar"
                        aria-label="Buscar en El Ermitario"
                        aria-controls="search-results"
                        [attr.aria-expanded]="searchQuery.trim().length > 0"
                        autocomplete="off"
                        [(ngModel)]="searchQuery"
                        (ngModelChange)="onSearchChange($event)"
                        (keydown.escape)="clearSearch()">
                    <button class="btn btn-outline-dark" type="submit">Buscar</button>
                    <ul class="search-results" id="search-results" *ngIf="searchQuery.trim()">
                        <li *ngIf="isSearching" class="search-message" role="status">Buscando...</li>
                        <li *ngIf="searchError" class="search-message search-error" role="alert">{{searchError}}</li>
                        <li *ngIf="!isSearching && !searchError && searchResults.length === 0" class="search-message" role="status">
                            No se encontraron resultados.
                        </li>
                        <li *ngFor="let result of searchResults">
                            <button type="button" class="search-result" (click)="selectSearchResult(result, cart)">
                                <img *ngIf="result.image" [src]="result.image" [alt]="result.title" class="search-result-image">
                                <span class="search-result-copy">
                                    <span class="search-result-title">{{result.title}}</span>
                                    <span class="search-result-description">{{result.description}}</span>
                                </span>
                                <span class="search-result-category">{{result.category}}</span>
                            </button>
                        </li>
                    </ul>
                </form>
                <div class="cart-icon-container ms-3">
                    <button class="btn-cart" (click)="cart.toggleCart()">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" *ngIf="(itemCount$ | async) as count; else noBadge">
                            {{ count }}
                        </span>
                        <ng-template #noBadge></ng-template>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</div>
<div class="header-bottom"></div>
<router-outlet></router-outlet>
<app-cart #cart></app-cart>
<app-confetti [trigger]="showConfetti"></app-confetti>
